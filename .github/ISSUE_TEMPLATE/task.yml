name: Task
description: Track bounded implementation, maintenance, or operational work
title: "[Task] "
labels:
  - type/task
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective and scope
      description: State the bounded work to complete.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: What does success look like?
      description: Describe the expected result, how to verify it, and any relevant dependencies or approvals.
    validations:
      required: true
