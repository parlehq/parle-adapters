name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-codex-hooks:
    name: Codex Windows hook launcher
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Self-contained: the launcher tests spawn the exact commandWindows
      # string against the committed hooks, so no workspace install is needed.
      - name: Run Windows launcher behavioral tests
        run: node --test packages/codex-plugin/test/windows-launcher.test.mjs

  ci:
    name: Typecheck and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.34.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check manifest versions
        run: pnpm check:manifests

      - name: Check clean MCP artifact reproducibility
        run: pnpm check:mcp-artifacts

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with ambient Parle configuration
        env:
          PARLE_PROFILE: ci-ambient-profile
          PARLE_SESSION_ALIAS: ci-ambient-route
        run: pnpm test

      - name: Upload Claude Desktop MCPB
        uses: actions/upload-artifact@v7
        with:
          name: parle-claude-desktop-extension
          path: packages/claude-desktop-extension/out/parle-claude-desktop-extension.mcpb
          if-no-files-found: error
          retention-days: 14
